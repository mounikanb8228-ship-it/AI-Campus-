{% extends "base.html" %}
{% block title %}Log in - Smart Campus Assistant{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Log in</h1>
  <form method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="usn">USN or staff ID</label>
    <input id="usn" name="usn" type="text" required maxlength="15" autocomplete="username" autocapitalize="characters">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="200" autocomplete="current-password">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Register</a></p>
</section>
{% endblock %}
